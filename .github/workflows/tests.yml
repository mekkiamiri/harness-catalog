name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ai-radar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/ai-radar
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run python -m unittest discover -s tests -v
      - name: The MCP server starts
        run: uv run python -c "from ai_radar.server import mcp; print(mcp.name)"
