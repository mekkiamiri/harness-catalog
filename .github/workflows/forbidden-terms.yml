# Server-side safety net: fails if a forbidden term appears in the repository content or history.
# The list lives only in the FORBIDDEN_TERMS secret (one term per line), never in the repository.
name: forbidden-terms
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan content and history
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          if [ -z "$FORBIDDEN_TERMS" ]; then
            echo "FORBIDDEN_TERMS secret is not set: skipping (forks and first setup)."
            exit 0
          fi
          printf '%s\n' "$FORBIDDEN_TERMS" | sed '/^[[:space:]]*$/d; /^#/d' > "$RUNNER_TEMP/terms.txt"
          found=0
          if git grep -I -i -F -q -f "$RUNNER_TEMP/terms.txt" -- . ; then
            echo "::error::A forbidden term is present in the current content."; found=1
          fi
          if git log --all -p --format='%an %ae %cn %ce %s' | grep -i -F -q -f "$RUNNER_TEMP/terms.txt"; then
            echo "::error::A forbidden term is present in the history (content, authors or messages)."; found=1
          fi
          exit $found
