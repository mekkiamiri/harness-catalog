# AI radar every morning on GitHub Actions, dashboard published on GitHub Pages.
# Free on a public repo. No LLM (no briefs): collection + scores + events + dashboard.
# Enable Pages: Settings > Pages > Source: GitHub Actions.
name: ai-radar
on:
  schedule:
    - cron: "5 6 * * *" # 06:05 UTC
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: astral-sh/setup-uv@v6
      # Keep the 30-day history between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.ai-radar/radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-
      - name: Collect and build the dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_RADAR_NOTIFY: none
        run: uvx --from git+https://github.com/mekkiamiri/harness-catalog@ai-radar-v0.1.1#subdirectory=plugins/ai-radar ai-radar run
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ~/.ai-radar/dashboard
      - id: deploy
        uses: actions/deploy-pages@v4
