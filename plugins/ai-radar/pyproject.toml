[project]
name = "ai-radar"
version = "0.1.1"
description = "Know about new AI tools, models and papers the day they ship. Daily radar ranked by cross-source resonance, with briefs, adaptive labs, conferences and CFP alerts. CLI + MCP server + Claude Code plugin."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Mekki Amiri" }]
keywords = ["ai", "radar", "mcp", "claude-code", "agents", "skills", "cfp", "conferences"]
dependencies = ["mcp>=2.3"]

[project.scripts]
ai-radar = "ai_radar.cli:main"

[project.urls]
Homepage = "https://github.com/mekkiamiri/harness-catalog/tree/main/plugins/ai-radar"
Issues = "https://github.com/mekkiamiri/harness-catalog/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_radar"]
