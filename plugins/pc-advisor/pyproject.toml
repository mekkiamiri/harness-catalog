[project]
name = "pc-advisor"
version = "0.1.0"
description = "Buy the right computer for dev and local AI: from a need to a ranked list of real offers (new and refurbished, France and EU) with verified prices and sources. CLI + MCP server + Claude Code plugin."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Mekki Amiri" }]
keywords = ["pc", "laptop", "mini-pc", "mac", "refurbished", "buying-guide", "mcp", "claude-code"]
dependencies = ["mcp>=2.3"]

[project.scripts]
pc-advisor = "pc_advisor.cli:main"

[project.urls]
Homepage = "https://github.com/mekkiamiri/harness-catalog/tree/main/plugins/pc-advisor"
Issues = "https://github.com/mekkiamiri/harness-catalog/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pc_advisor"]
